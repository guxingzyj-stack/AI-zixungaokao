# Zeabur deployment configuration

service:
  name: gaokao-consultation
  region: auto

env:
  - key: SILICONCLOUD_API_KEY
    value: ""
    type: USER_INPUT
    required: true

  - key: LLM_MODEL
    value: "deepseek-ai/DeepSeek-V3.1-Terminus"
    type: PLAIN

  - key: EMBEDDING_MODEL
    value: "BAAI/bge-m3"
    type: PLAIN

  - key: SILICONCLOUD_BASE_URL
    value: "https://api.siliconflow.cn/v1"
    type: PLAIN

  - key: QDRANT_URL
    value: ""
    type: USER_INPUT
    required: false

  - key: QDRANT_API_KEY
    value: ""
    type: USER_INPUT
    required: false

  - key: QDRANT_PORT
    value: "6333"
    type: PLAIN

  - key: DB_DOWNLOAD_URL
    value: "https://github.com/guxingzyj-stack/my-first-project/releases/download/v1.3-db/gaokao_2025.db"
    type: PLAIN

  - key: DB_FORCE_DOWNLOAD
    value: "0"
    type: PLAIN

  - key: STATS_KEY
    value: ""
    type: USER_INPUT
    required: true

build:
  dockerfile: Dockerfile
